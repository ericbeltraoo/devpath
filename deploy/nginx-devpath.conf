# ===========================================================================
# devpath.lastweek.com.br
# ===========================================================================
# Instalar na VPS:
#   sudo cp nginx-devpath.conf /etc/nginx/sites-available/devpath.lastweek.com.br
#   sudo ln -s /etc/nginx/sites-available/devpath.lastweek.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# O bloco 443 so funciona DEPOIS do certbot. Ordem correta:
#   1. suba so o bloco 80 (comente o 443)
#   2. rode o certbot, que preenche os caminhos do certificado
#   3. descomente o 443
#
# Este arquivo NAO toca na configuracao do lastweek.com.br. Sao server blocks
# independentes, separados por server_name.
# ===========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name devpath.lastweek.com.br;

    # O certbot precisa deste caminho para validar o dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devpath.lastweek.com.br;

    ssl_certificate     /etc/letsencrypt/live/devpath.lastweek.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devpath.lastweek.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/devpath.lastweek.com.br;
    index index.html;

    # ----------------------------------------------------------- seguranca
    # Aqui os cabecalhos funcionam de verdade, ao contrario do GitHub Pages:
    # frame-ancestors e HSTS so existem como cabecalho HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # connect-src 'self' basta: a API vive no mesmo dominio, sob /api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    client_max_body_size 2m;

    # ----------------------------------------------------------------- API
    # Mesmo dominio do frontend, entao o cookie do refresh e first-party e
    # sobrevive as politicas de bloqueio de cookie de terceiros dos navegadores.
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # A API monta a propria resposta de erro; sem isto o Nginx
        # substituiria o JSON por uma pagina HTML.
        proxy_intercept_errors off;
    }

    # ------------------------------------------------------------ frontend
    # Assets com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca em cache: e ele que aponta para os assets novos apos
    # um deploy. Sem isto, o navegador serve a versao antiga por dias.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # O app usa HashRouter, entao nao ha rota de servidor para resolver.
    # O fallback fica por seguranca, caso um dia se troque para BrowserRouter.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/estudo.access.log;
    error_log  /var/log/nginx/estudo.error.log;
}
